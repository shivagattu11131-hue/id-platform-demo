server:
  port: 0

spring:
  application:
    name: id-platform-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    default-property-inclusion: non_null

id-platform:
  issuer: http://localhost:0
  jwt:
    access-token-expiry: 900000
    refresh-token-expiry: 604800000
    id-token-expiry: 600000
    algorithm: RS256

  oidc:
    authorization-code-expiry: 600000
    require-pkce: true

  clients:
    main-site:
      client-id: main-site
      client-secret: main-site-secret
      redirect-uris:
        - http://localhost:3001/callback
      scope: openid profile email
      name: Main Site
    ma-site:
      client-id: ma-site
      client-secret: ma-site-secret
      redirect-uris:
        - http://localhost:3002/callback
      scope: openid profile email
      name: MA Site

logging:
  level:
    com.raksul.idplatform: DEBUG
