<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raksul ID Platform - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #333;
            font-size: 24px;
            font-weight: 600;
        }
        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        .app-info {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            text-align: center;
        }
        .app-info p {
            color: #666;
            font-size: 13px;
        }
        .app-info strong {
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5eb;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #999;
            font-size: 12px;
        }
        .scopes {
            margin-bottom: 20px;
        }
        .scopes h3 {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        .scope-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .scope-badge {
            background: #e8f4fd;
            color: #1976d2;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Raksul ID Platform</h1>
            <p>Sign in to continue</p>
        </div>

        <div class="app-info" th:if="${clientName}">
            <p>Signing in to <strong th:text="${clientName}">Application</strong></p>
        </div>

        <div class="scopes" th:if="${scopes}">
            <h3>Requested Permissions:</h3>
            <div class="scope-list">
                <span class="scope-badge" th:each="scope : ${scopes}" th:text="${scope}">scope</span>
            </div>
        </div>

        <div class="error-message" id="errorMessage" th:text="${error}">Error</div>

        <form id="loginForm" th:action="@{/oauth2/authorize}" method="post">
            <input type="hidden" name="response_type" th:value="${responseType}">
            <input type="hidden" name="client_id" th:value="${clientId}">
            <input type="hidden" name="redirect_uri" th:value="${redirectUri}">
            <input type="hidden" name="scope" th:value="${scope}">
            <input type="hidden" name="state" th:value="${state}">
            <input type="hidden" name="nonce" th:value="${nonce}">
            <input type="hidden" name="code_challenge" th:value="${codeChallenge}">
            <input type="hidden" name="code_challenge_method" th:value="${codeChallengeMethod}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="footer">
            <p>Protected by Raksul ID Platform</p>
        </div>
    </div>

    <script th:if="${error}">
        document.getElementById('errorMessage').classList.add('show');
    </script>
</body>
</html>
