server:
  port: 3000

spring:
  application:
    name: id-platform

  datasource:
    url: jdbc:h2:file:./id_platform_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    default-property-inclusion: non_null

id-platform:
  issuer: ${ID_PLATFORM_ISSUER:http://localhost:3000}
  jwt:
    access-token-expiry: 900000        # 15 minutes
    refresh-token-expiry: 604800000    # 7 days
    id-token-expiry: 600000            # 10 minutes
    algorithm: RS256

  oidc:
    authorization-code-expiry: 600000  # 10 minutes
    require-pkce: true

  clients:
    main-site:
      client-id: main-site
      client-secret: main-site-secret
      redirect-uris:
        - ${MAIN_SITE_REDIRECT_URI:http://localhost:3001/callback}
      scope: openid profile email
      name: Main Site
    ma-site:
      client-id: ma-site
      client-secret: ma-site-secret
      redirect-uris:
        - ${MA_SITE_REDIRECT_URI:http://localhost:3002/callback}
      scope: openid profile email
      name: MA Site

  migration:
    main-site:
      name: Main Site
      url: ${MAIN_SITE_URL:http://localhost:3001}
    ma-site:
      name: MA Site
      url: ${MA_SITE_URL:http://localhost:3002}

logging:
  level:
    com.raksul.idplatform: DEBUG
